name: Web build

# Exports the game for the browser on every push to main and publishes it on Vercel.
# The Vercel step only runs once the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# repository secrets exist; the build itself always runs and is kept as an artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "stable"

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          mkdir -p ~/godot /tmp/godot-dl
          curl -fsSL -o /tmp/godot-dl/godot.zip "${base}/Godot_v${tag}_linux.x86_64.zip"
          unzip -q /tmp/godot-dl/godot.zip -d /tmp/godot-dl
          mv "/tmp/godot-dl/Godot_v${tag}_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/godot-dl/templates.tpz "${base}/Godot_v${tag}_export_templates.tpz"
          unzip -q /tmp/godot-dl/templates.tpz -d /tmp/godot-dl
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$dest"
          # only the web templates are needed: keeps the cache small
          mv /tmp/godot-dl/templates/web_* /tmp/godot-dl/templates/version.txt "$dest/"

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Export for the web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          cp web/vercel.json build/web/vercel.json
          ls -la build/web

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: dreadhold-web
          path: build/web
          retention-days: 7

      - name: Publish on Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx --yes vercel@50 deploy build/web --prod --yes --token "$VERCEL_TOKEN"
