name: Release

# Builds the desktop game (Windows, Linux) and publishes it as a GitHub release.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), or by hand.
# Release notes come from docs/release-notes/<tag>.md when that file exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "stable"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Cache Godot and the desktop export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-desktop

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          mkdir -p ~/godot /tmp/godot-dl
          curl -fsSL -o /tmp/godot-dl/godot.zip "${base}/Godot_v${tag}_linux.x86_64.zip"
          unzip -q /tmp/godot-dl/godot.zip -d /tmp/godot-dl
          mv "/tmp/godot-dl/Godot_v${tag}_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/godot-dl/templates.tpz "${base}/Godot_v${tag}_export_templates.tpz"
          unzip -q /tmp/godot-dl/templates.tpz -d /tmp/godot-dl
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$dest"
          # only the 64-bit Windows and Linux templates are needed: keeps the cache small
          mv /tmp/godot-dl/templates/windows_*_x86_64*.exe /tmp/godot-dl/templates/linux_*.x86_64 /tmp/godot-dl/templates/version.txt "$dest/"

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Export Windows and Linux
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux dist
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/Dreadhold.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Dreadhold.x86_64
          chmod +x build/linux/Dreadhold.x86_64
          (cd build/windows && zip -9 -q "../../dist/Dreadhold-${TAG}-windows-x86_64.zip" Dreadhold.exe)
          tar -C build/linux -czf "dist/Dreadhold-${TAG}-linux-x86_64.tar.gz" Dreadhold.x86_64
          ls -la build/windows build/linux dist

      - name: Keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: dreadhold-desktop-${{ env.TAG }}
          path: dist
          retention-days: 14

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${TAG}.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "Dreadhold ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --title "Dreadhold ${TAG}" --generate-notes
          fi
